<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="wclassth=device-wclassth, initial-scale=1.0"
    />
    <title>Fruits Gacha Card</title>
    <link rel="stylesheet" href="Game_Card.css " />
  </head>
  <body>
    <main class="container">
      <div class="game-title">
        <h1>FRUITS GACHA LIFE</h1>
      </div>

      <div class="game-info">
        <div>
          <span class="Moves">Moves: <span id="moves">0</span> </span>
        </div>
        <div>
          <span class="Time">Time: <span id="times">00:00</span></span>
        </div>
        <div>
          <span class="Score">Score: <span id="score">1000</span></span>
        </div>
      </div>

      <div id="board-cards" class="board-cards">
        <div class="card"><span>?</span></div>
        <div class="card"><span>?</span></div>
        <div class="card"><span>?</span></div>
        <div class="card"><span>?</span></div>
        <div class="card"><span>?</span></div>
        <div class="card"><span>?</span></div>
        <div class="card"><span>?</span></div>
        <div class="card"><span>?</span></div>
        <div class="card"><span>?</span></div>
        <div class="card"><span>?</span></div>
        <div class="card"><span>?</span></div>
        <div class="card"><span>?</span></div>
        <div class="card"><span>?</span></div>
        <div class="card"><span>?</span></div>
        <div class="card"><span>?</span></div>
        <div class="card"><span>?</span></div>
      </div>

      <div id="win">
        <div class="win-box">
          <h2>You Win!</h2>

          <p>Moves: <span id="final-moves"></span></p>
          <p>Score: <span id="final-score"></span></p>
          <p>Time: <span id="final-time"></span></p>

          <button id="play-again">PLAY AGAIN!</button>
        </div>
      </div>
      <button type="button" id="reset-btn">Reset</button>
    </main>

    <script src="Game_Card.js"></script>
  </body>
</html>
